name: CI

on:
  push:
    branches: [master, 'wp/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Our ffmpeg for Windows is cross-compiled on Linux (docs/briefs/R1-own-ffmpeg-builds.md),
  # since the Windows runners have no WSL; the Windows checks take it from here.
  ffmpeg-windows:
    name: ffmpeg for Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: vendor/ffmpeg/win-x64
          key: ffmpeg-win-x64-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-decoder.sh', 'apps/desktop/native/decoder/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh win vendor/ffmpeg/win-x64
      # vo-decode, which reads H.264 and the like through Media Foundation (R3).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-decoder.sh win vendor/ffmpeg/win-x64/bin
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win-x64
          path: vendor/ffmpeg/win-x64

  verify:
    name: Verify (${{ matrix.os }})
    needs: ffmpeg-windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The media pipeline's ffmpeg, built from pinned sources (about ten minutes), so the
      # result is kept between runs until the build script changes. Windows takes the one
      # cross-compiled above; fetch:ffmpeg then finds it in place.
      - if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-decoder.sh', 'apps/desktop/native/decoder/**') }}
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win-x64
          path: vendor/ffmpeg/win-x64
      - run: npm run fetch:ffmpeg
      # The speech tests use the system's espeak-ng on Linux (docs/briefs/P6.8-text-to-speech.md).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The end-to-end tests open published courses in Chromium (Playwright's own build).
      - name: Install Chromium for the end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium for the end-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: End-to-end tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results

  package:
    name: Package (${{ matrix.os }})
    needs: [verify, ffmpeg-windows]
    # Built even when a check fails, so an intermittent test never holds the installers back;
    # the checks still show their failures (Luke, 2026-11-27: "force an installer build").
    if: ${{ !cancelled() && needs.ffmpeg-windows.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: apps/desktop/release/linux-unpacked/vedraopus
          - os: macos-latest
            app: apps/desktop/release/mac-arm64/Vedra Opus.app
            executable: apps/desktop/release/mac-arm64/Vedra Opus.app/Contents/MacOS/Vedra Opus
          # Intel Macs (Luke, 2026-11-27, alpha 5). Its ffmpeg is built here on the first run,
          # then cached by architecture like the others.
          - os: macos-15-intel
            app: apps/desktop/release/mac/Vedra Opus.app
            executable: apps/desktop/release/mac/Vedra Opus.app/Contents/MacOS/Vedra Opus
          - os: windows-latest
            executable: apps/desktop/release/win-unpacked/Vedra Opus.exe
    env:
      # Unsigned until P11.4.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The ffmpeg the checks above used: from the cache, or on Windows the cross-compiled
      # build, so packaging does not build its own (it cannot on Windows, without WSL).
      - if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-decoder.sh', 'apps/desktop/native/decoder/**') }}
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-win-x64
          path: vendor/ffmpeg/win-x64
      # Packaging never uploads: a release is published by hand (docs/releasing.md).
      # The Mac apps are signed ad hoc (`-c.mac.identity=-`), as alpha 4's were: without it,
      # Apple Silicon calls the downloaded app "damaged" (skills/project-specific.md #174).
      - id: package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npm run fetch:ffmpeg && npm run fetch:libreoffice &&
              npm run package --workspace=vedraopus-desktop -- -c.mac.identity=-
          else
            npm run package
          fi
      - name: Check the Mac app's ad-hoc signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "${{ matrix.app }}"
      # The smoke test is the end-to-end suite, which opens published courses in Chromium.
      - name: Install Chromium for the smoke test (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium for the smoke test
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      # The performance budget is left out here: the checks above run it on all three systems
      # against the same code, and CI's shared macOS machine can miss it by a hair while
      # packaging (Luke, 2026-11-26).
      - name: Smoke-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep-invert "200-slide project"
        env:
          VEDRAOPUS_E2E_EXECUTABLE: ${{ matrix.executable }}
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: npx playwright test --grep-invert "200-slide project"
        env:
          VEDRAOPUS_E2E_EXECUTABLE: ${{ matrix.executable }}
      # When the smoke test fails, its report and traces, as the checks keep theirs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
      # The installers are kept whenever they were built, even if the smoke test then failed;
      # the job still shows the failure (Luke, 2026-11-27).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: vedraopus-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
